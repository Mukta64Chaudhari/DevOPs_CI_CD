<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Book - Library Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h2>📚 Library Management System</h2>
            <div class="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="add-book.html">Add Book</a>
                <a href="view-books.html">View Books</a>
                <a href="search-book.html">Search</a>
                <a href="issue-return-book.html">Issue/Return</a>
                <a href="logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="form-container">
            <h1>Add New Book</h1>
            <form id="addBookForm" onsubmit="return addBook(event)">
                <div class="form-group">
                    <label for="bookId">Book ID: <span class="required">*</span></label>
                    <input type="number" id="bookId" name="bookId" required>
                </div>

                <div class="form-group">
                    <label for="bookTitle">Title: <span class="required">*</span></label>
                    <input type="text" id="bookTitle" name="bookTitle" placeholder="Enter book title" required>
                </div>

                <div class="form-group">
                    <label for="bookAuthor">Author: <span class="required">*</span></label>
                    <input type="text" id="bookAuthor" name="bookAuthor" placeholder="Enter author name" required>
                </div>

                <button type="submit" class="btn btn-primary">Add Book</button>
                <button type="reset" class="btn btn-secondary">Clear</button>
            </form>

            <div id="message" class="message"></div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        function addBook(event) {
            event.preventDefault();

            const bookId = document.getElementById('bookId').value.trim();
            const bookTitle = document.getElementById('bookTitle').value.trim();
            const bookAuthor = document.getElementById('bookAuthor').value.trim();

            if (!bookId || !bookTitle || !bookAuthor) {
                showMessage('Please fill in all fields!', 'error');
                return false;
            }

            const formData = new URLSearchParams();
            formData.append('action', 'add');
            formData.append('id', bookId);
            formData.append('title', bookTitle);
            formData.append('author', bookAuthor);

            fetch('api/books', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            })
            .then(response => {
                console.log('Response status:', response.status, 'Content-Type:', response.headers.get('content-type'));
                
                if (response.status === 401) {
                    alert('Session expired. Please login again.');
                    window.location.href = 'index.html';
                    return null;
                }
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    throw new Error('Response is not JSON. Received: ' + contentType);
                }
                
                return response.json();
            })
            .then(data => {
                if (data === null) return;
                
                if (data.success) {
                    showMessage(data.message, 'success');
                    document.getElementById('addBookForm').reset();
                    setTimeout(() => {
                        window.location.href = 'view-books.html';
                    }, 1500);
                } else {
                    showMessage(data.message || data.error || 'Error adding book', 'error');
                }
            })
            .catch(error => {
                console.error('Fetch error:', error);
                showMessage('Error: ' + error.message, 'error');
            });

            return false;
        }

        function showMessage(message, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = message;
            messageDiv.className = 'message ' + type;
            messageDiv.style.display = 'block';

            if (type === 'success') {
                setTimeout(() => {
                    messageDiv.style.display = 'none';
                }, 3000);
            }
        }

        // Check if user is logged in
        window.onload = function() {
            checkSession();
        };

        function checkSession() {
            fetch('api/books?action=all')
                .catch(error => {
                    if (error.status === 401) {
                        window.location.href = 'index.html';
                    }
                });
        }
    </script>
</body>
</html>
