<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Books - Library Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h2>📚 Library Management System</h2>
            <div class="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="add-book.html">Add Book</a>
                <a href="view-books.html">View Books</a>
                <a href="search-book.html">Search</a>
                <a href="issue-return-book.html">Issue/Return</a>
                <a href="logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1>All Books in Library</h1>

        <div id="loadingSpinner" class="loading">Loading books...</div>
        <div id="booksTable"></div>
        <div id="noBooks" class="info-message" style="display: none;">No books in the library yet.</div>
    </div>

    <script src="script.js"></script>
    <script>
        window.onload = function() {
            loadAllBooks();
        };

        function loadAllBooks() {
            fetch('api/books?action=all')
                .then(response => {
                    console.log('Response status:', response.status, 'Content-Type:', response.headers.get('content-type'));
                    
                    if (response.status === 401) {
                        alert('Session expired. Please login again.');
                        window.location.href = 'index.html';
                        return null;
                    }
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const contentType = response.headers.get('content-type');
                    if (!contentType || !contentType.includes('application/json')) {
                        throw new Error('Response is not JSON. Received: ' + contentType);
                    }
                    
                    return response.json();
                })
                .then(books => {
                    if (books === null) return; // Session error already handled
                    
                    document.getElementById('loadingSpinner').style.display = 'none';

                    if (books.length === 0) {
                        document.getElementById('noBooks').style.display = 'block';
                        return;
                    }

                    displayBooks(books);
                })
                .catch(error => {
                    console.error('Fetch error:', error);
                    document.getElementById('loadingSpinner').style.display = 'none';
                    alert('Error loading books: ' + error.message);
                });
        }

        function displayBooks(books) {
            let tableHTML = '<table class="data-table"><thead><tr><th>ID</th><th>Title</th><th>Author</th><th>Status</th><th>Action</th></tr></thead><tbody>';

            books.forEach(book => {
                const statusClass = book.issued ? 'status-issued' : 'status-available';
                const statusText = book.issued ? 'Issued' : 'Available';
                tableHTML += `
                    <tr>
                        <td>${book.id}</td>
                        <td>${book.title}</td>
                        <td>${book.author}</td>
                        <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                        <td><button class="btn btn-small btn-danger" onclick="deleteBook(${book.id})">Delete</button></td>
                    </tr>
                `;
            });

            tableHTML += '</tbody></table>';
            document.getElementById('booksTable').innerHTML = tableHTML;
        }

        function deleteBook(bookId) {
            if (confirm('Are you sure you want to delete this book?')) {
                const formData = new URLSearchParams();
                formData.append('action', 'delete');
                formData.append('id', bookId);

                fetch('api/books', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                })
                .then(response => {
                    console.log('Response status:', response.status, 'Content-Type:', response.headers.get('content-type'));
                    
                    if (response.status === 401) {
                        alert('Session expired. Please login again.');
                        window.location.href = 'index.html';
                        return null;
                    }
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const contentType = response.headers.get('content-type');
                    if (!contentType || !contentType.includes('application/json')) {
                        throw new Error('Response is not JSON. Received: ' + contentType);
                    }
                    
                    return response.json();
                })
                .then(data => {
                    if (data === null) return;
                    
                    if (data.success) {
                        alert(data.message);
                        loadAllBooks();
                    } else {
                        alert('Error: ' + data.message);
                    }
                })
                .catch(error => {
                    console.error('Fetch error:', error);
                    alert('Error: ' + error.message);
                });
            }
        }
    </script>
</body>
</html>
