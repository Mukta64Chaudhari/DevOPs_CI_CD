<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Books - Library Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h2>📚 Library Management System</h2>
            <div class="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="add-book.html">Add Book</a>
                <a href="view-books.html">View Books</a>
                <a href="search-book.html">Search</a>
                <a href="issue-return-book.html">Issue/Return</a>
                <a href="logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="search-container">
            <h1>Search Books</h1>

            <div class="search-form">
                <input type="text" id="searchQuery" placeholder="Enter search query..." onkeyup="handleSearch()">
                <select id="searchType">
                    <option value="title">Search by Title</option>
                    <option value="author">Search by Author</option>
                </select>
                <button class="btn btn-primary" onclick="performSearch()">Search</button>
                <button class="btn btn-secondary" onclick="clearSearch()">Clear</button>
            </div>

            <div id="searchResults"></div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        let searchTimeout;

        function handleSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                performSearch();
            }, 500);
        }

        function performSearch() {
            const query = document.getElementById('searchQuery').value.trim();
            const searchType = document.getElementById('searchType').value;

            if (query === '') {
                document.getElementById('searchResults').innerHTML = '';
                return;
            }

            const url = `api/books?action=search&query=${encodeURIComponent(query)}&type=${searchType}`;

            fetch(url)
                .then(response => {
                    console.log('Response status:', response.status, 'Content-Type:', response.headers.get('content-type'));
                    
                    if (response.status === 401) {
                        alert('Session expired. Please login again.');
                        window.location.href = 'index.html';
                        return null;
                    }
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const contentType = response.headers.get('content-type');
                    if (!contentType || !contentType.includes('application/json')) {
                        throw new Error('Response is not JSON. Received: ' + contentType);
                    }
                    
                    return response.json();
                })
                .then(books => {
                    if (books === null) return; // Session error already handled
                    displaySearchResults(books);
                })
                .catch(error => {
                    console.error('Fetch error:', error);
                    document.getElementById('searchResults').innerHTML = '<p class="error-message">Error: ' + error.message + '</p>';
                });
        }

        function displaySearchResults(books) {
            if (books.length === 0) {
                document.getElementById('searchResults').innerHTML = '<p class="info-message">No books found matching your search.</p>';
                return;
            }

            let tableHTML = '<table class="data-table"><thead><tr><th>ID</th><th>Title</th><th>Author</th><th>Status</th></tr></thead><tbody>';

            books.forEach(book => {
                const statusClass = book.issued ? 'status-issued' : 'status-available';
                const statusText = book.issued ? 'Issued' : 'Available';
                tableHTML += `
                    <tr>
                        <td>${book.id}</td>
                        <td>${book.title}</td>
                        <td>${book.author}</td>
                        <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                    </tr>
                `;
            });

            tableHTML += '</tbody></table>';
            document.getElementById('searchResults').innerHTML = tableHTML;
        }

        function clearSearch() {
            document.getElementById('searchQuery').value = '';
            document.getElementById('searchResults').innerHTML = '';
        }
    </script>
</body>
</html>
