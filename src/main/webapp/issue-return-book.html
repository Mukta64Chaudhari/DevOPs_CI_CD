<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue/Return Books - Library Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h2>📚 Library Management System</h2>
            <div class="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="add-book.html">Add Book</a>
                <a href="view-books.html">View Books</a>
                <a href="search-book.html">Search</a>
                <a href="issue-return-book.html">Issue/Return</a>
                <a href="logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="form-container">
            <h1>Issue/Return Books</h1>

            <div class="tabs">
                <button class="tab-button active" onclick="switchTab('issue')">Issue Book</button>
                <button class="tab-button" onclick="switchTab('return')">Return Book</button>
            </div>

            <!-- Issue Book Tab -->
            <div id="issueTab" class="tab-content">
                <h2>Issue a Book</h2>
                <form id="issueForm" onsubmit="return issueBook(event)">
                    <div class="form-group">
                        <label for="issueBookId">Book ID: <span class="required">*</span></label>
                        <input type="number" id="issueBookId" name="issueBookId" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Issue Book</button>
                    <button type="reset" class="btn btn-secondary">Clear</button>
                </form>
                <div id="issueMessage" class="message"></div>
            </div>

            <!-- Return Book Tab -->
            <div id="returnTab" class="tab-content" style="display: none;">
                <h2>Return a Book</h2>
                <form id="returnForm" onsubmit="return returnBook(event)">
                    <div class="form-group">
                        <label for="returnBookId">Book ID: <span class="required">*</span></label>
                        <input type="number" id="returnBookId" name="returnBookId" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Return Book</button>
                    <button type="reset" class="btn btn-secondary">Clear</button>
                </form>
                <div id="returnMessage" class="message"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        function switchTab(tabName) {
            // Hide all tabs
            document.getElementById('issueTab').style.display = 'none';
            document.getElementById('returnTab').style.display = 'none';

            // Remove active class from all buttons
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });

            // Show selected tab
            if (tabName === 'issue') {
                document.getElementById('issueTab').style.display = 'block';
                event.target.classList.add('active');
            } else {
                document.getElementById('returnTab').style.display = 'block';
                event.target.classList.add('active');
            }
        }

        function issueBook(event) {
            event.preventDefault();

            const bookId = document.getElementById('issueBookId').value.trim();

            if (!bookId) {
                showIssueMessage('Please enter a book ID!', 'error');
                return false;
            }

            const formData = new URLSearchParams();
            formData.append('action', 'issue');
            formData.append('id', bookId);

            fetch('api/books', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            })
            .then(response => {
                console.log('Response status:', response.status, 'Content-Type:', response.headers.get('content-type'));
                
                if (response.status === 401) {
                    alert('Session expired. Please login again.');
                    window.location.href = 'index.html';
                    return null;
                }
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    throw new Error('Response is not JSON. Received: ' + contentType);
                }
                
                return response.json();
            })
            .then(data => {
                if (data === null) return;
                
                if (data.success) {
                    showIssueMessage(data.message, 'success');
                    document.getElementById('issueForm').reset();
                } else {
                    showIssueMessage(data.message || data.error, 'error');
                }
            })
            .catch(error => {
                console.error('Fetch error:', error);
                showIssueMessage('Error: ' + error.message, 'error');
            });

            return false;
        }

        function returnBook(event) {
            event.preventDefault();

            const bookId = document.getElementById('returnBookId').value.trim();

            if (!bookId) {
                showReturnMessage('Please enter a book ID!', 'error');
                return false;
            }

            const formData = new URLSearchParams();
            formData.append('action', 'return');
            formData.append('id', bookId);

            fetch('api/books', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            })
            .then(response => {
                console.log('Response status:', response.status, 'Content-Type:', response.headers.get('content-type'));
                
                if (response.status === 401) {
                    alert('Session expired. Please login again.');
                    window.location.href = 'index.html';
                    return null;
                }
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    throw new Error('Response is not JSON. Received: ' + contentType);
                }
                
                return response.json();
            })
            .then(data => {
                if (data === null) return; // Session error already handled
                
                if (data.success) {
                    showReturnMessage(data.message, 'success');
                    document.getElementById('returnForm').reset();
                } else {
                    showReturnMessage(data.message || data.error, 'error');
                }
            })
            .catch(error => {
                console.error('Fetch error:', error);
                showReturnMessage('Error: ' + error.message, 'error');
            });

            return false;
        }

        function showIssueMessage(message, type) {
            const messageDiv = document.getElementById('issueMessage');
            messageDiv.textContent = message;
            messageDiv.className = 'message ' + type;
            messageDiv.style.display = 'block';

            if (type === 'success') {
                setTimeout(() => {
                    messageDiv.style.display = 'none';
                }, 3000);
            }
        }

        function showReturnMessage(message, type) {
            const messageDiv = document.getElementById('returnMessage');
            messageDiv.textContent = message;
            messageDiv.className = 'message ' + type;
            messageDiv.style.display = 'block';

            if (type === 'success') {
                setTimeout(() => {
                    messageDiv.style.display = 'none';
                }, 3000);
            }
        }
    </script>
</body>
</html>
