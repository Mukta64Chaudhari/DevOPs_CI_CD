# SonarCloud configuration
# Replace YOUR_PROJECT_KEY and YOUR_ORG_KEY with values from SonarCloud dashboard
sonar.projectKey=YOUR_PROJECT_KEY
sonar.organization=YOUR_ORG_KEY
sonar.projectName=LibraryManagementSystem
sonar.projectVersion=1.0

# Source and test paths
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes

# Encoding
sonar.sourceEncoding=UTF-8

# Exclude compiled classes and target folder from analysis
sonar.exclusions=target/**,**/*.class

sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.java.coveragePlugin=jacoco
