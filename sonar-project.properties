# SonarCloud configuration
# Read keys from environment variables when available
sonar.projectKey=${env.SONAR_PROJECT_KEY}
sonar.organization=${env.SONAR_ORGANIZATION}
sonar.projectName=LibraryManagementSystem
sonar.projectVersion=1.0
sonar.host.url=https://sonarcloud.io
sonar.login=${env.SONAR_TOKEN}

# Source and test paths
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes

# Encoding
sonar.sourceEncoding=UTF-8

# Exclude compiled classes and target folder from analysis
sonar.exclusions=target/**,**/*.class
